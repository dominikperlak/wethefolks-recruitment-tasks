<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gut Run</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="ad">
      <div class="stage">
        <div class="scene">
          <div class="playfield">
            <div class="world">
              <img class="layer" src="./assets/01-game/bg-texture.png" alt="" />
              <div class="track">
                <img class="gut" src="./assets/01-game/gameplay.png" alt="" />
              </div>
              <img class="player" src="./assets/01-game/player.png" alt="" />
            </div>
          </div>
          <img class="layer" src="./assets/border.png" alt="" />
          <img class="gesture" src="./assets/gesture.png" alt="tap to run" />
        </div>
        <img
          class="layer headline"
          src="./assets/01-game/tut.png"
          alt="Bringe Poo durch den Darm ans Ziel."
        />
        <div class="endcard endcard-fail">
          <div class="endcard-canvas">
            <img class="layer bubble" src="./assets/02-endcard/fail/bubble.png" alt="" />
            <img class="layer bacterium" src="./assets/02-endcard/fail/bac1.png" alt="" />
            <img class="layer bacterium" src="./assets/02-endcard/fail/bac2.png" alt="" />
            <img class="layer bacterium" src="./assets/02-endcard/fail/bac3.png" alt="" />
            <img class="layer bacterium" src="./assets/02-endcard/fail/bac4.png" alt="" />
            <img class="layer bacterium" src="./assets/02-endcard/fail/bac5.png" alt="" />
            <img class="layer mascot" src="./assets/02-endcard/fail/sad.png" alt="" />
            <img
              class="layer endcard-headline"
              src="./assets/02-endcard/fail/hl.png"
              alt="Poo, das tat weh! Erfahre jetzt, was deinem Darm guttut."
            />
            <button class="button cta fail-cta" type="button">
              <img src="./assets/02-endcard/fail/cta.png" alt="Jetzt informieren!" />
            </button>
            <button class="button replay" type="button">
              <img src="./assets/02-endcard/fail/replay.png" alt="Nochmal spielen" />
            </button>
          </div>
        </div>
        <div class="endcard endcard-win">
          <div class="endcard-canvas">
            <img class="layer bubble" src="./assets/02-endcard/win/bubble.png" alt="" />
            <img class="layer confetti" src="./assets/02-endcard/win/konfetti.png" alt="" />
            <img class="layer mascot" src="./assets/02-endcard/win/happy.png" alt="" />
            <img
              class="layer endcard-headline"
              src="./assets/02-endcard/win/hl.png"
              alt="Poo, tut das gut! Wenn du weißt, was dein Darm braucht."
            />
            <button class="button cta win-cta" type="button">
              <img src="./assets/02-endcard/win/cta.png" alt="Jetzt mehr erfahren" />
            </button>
          </div>
        </div>
        <img class="layer" src="./assets/logo.png" alt="Logo" />
        <button class="mute-button" type="button" aria-label="Ton aus" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="speaker" d="M4 9h4l5-4v14l-5-4H4z" />
            <path class="sound-on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />
            <path class="sound-off" d="M16.5 9.5l5 5M21.5 9.5l-5 5" />
          </svg>
        </button>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
